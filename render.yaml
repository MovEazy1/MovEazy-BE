services:
  - type: web
    name: moveazy-flat-agent
    runtime: python
    rootDir: agent
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/sync_supabase_properties.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FLAT_AGENT_API_KEY
        sync: false
      - key: FLAT_AGENT_CORS
        value: https://your-app.vercel.app,https://moveeazy.in,https://www.moveeazy.in
